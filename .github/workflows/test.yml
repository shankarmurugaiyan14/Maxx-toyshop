
name: Docker Compose Test Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRETS }}

      - name: Validate Compose file
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build

      - name: Push images to Docker Hub
        run: docker compose push

      - name: Start application
        run: docker compose up -d

      - name: Wait for containers
        run: sleep 20

      - name: Check running containers
        run: |
          docker compose ps
          docker ps

      - name: Test frontend response
        run: |
          curl --fail --retry 5 --retry-delay 3 \
            http://localhost:81/

      - name: Show logs if pipeline fails
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application and clean up
        if: always()
        run: docker compose down --remove-orphans
