
name: Three Tier Application CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Verify Docker Hub username
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "ERROR: DOCKER_USERNAME variable is empty or unavailable"
            exit 1
          fi
          echo "Docker Hub username variable is available"

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build all three Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Check container status
        run: |
          docker compose ps
          docker ps

      - name: Test frontend
        run: |
          curl --fail --retry 10 --retry-delay 5 \
            --retry-connrefused \
            http://localhost:81/

      - name: Push images to Docker Hub
        run: docker compose push

      - name: Display logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application and cleanup
        if: always()
        run: docker compose down --remove-orphans
