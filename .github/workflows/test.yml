
name: Build and Deploy Maxx Toy Shop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config -q

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-database:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-database:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-frontend:latest

  deploy-ec2:
    name: Deploy to EC2
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "Checking EC2 host configuration..."

          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST secret is empty."
            exit 1
          fi

          # For production security, verify this host fingerprint
          # against a trusted source before accepting it.
          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose SSH and copy Compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          if [ -z "$EC2_USER" ]; then
            echo "EC2_USER secret is empty."
            exit 1
          fi

          if [ ! -f docker-compose.ec2.yml ]; then
            echo "docker-compose.ec2.yml was not found in the repository root."
            exit 1
          fi

          echo "Testing SSH connection to EC2..."

          ssh -vv \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p ~/maxx-toystore && echo SSH_CONNECTED' 2>&1

          echo "Copying Docker Compose file..."

          scp \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            docker-compose.ec2.yml \
            "$EC2_USER@$EC2_HOST:~/maxx-toystore/docker-compose.ec2.yml"

          echo "Compose file copied successfully."

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD,IMAGE_TAG,MYSQL_ROOT_PASSWORD
          script: |
            set -eu

            cd "$HOME/maxx-toystore"

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo systemctl enable --now docker
            fi

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose is not installed correctly."
              exit 1
            fi

            # Create a protected environment file.
            umask 077

            printf 'DOCKERHUB_USERNAME=%s\nIMAGE_TAG=%s\nMYSQL_ROOT_PASSWORD=%s\n' \
              "$DOCKERHUB_USERNAME" \
              "$IMAGE_TAG" \
              "$MYSQL_ROOT_PASSWORD" > .env

            # Authenticate Docker on EC2.
            printf '%s' "$DOCKERHUB_PASSWORD" |
              sudo docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            # Validate configuration before changing running containers.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml config -q

            # Pull the exact images built by this workflow.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml pull

            # Start or update the application.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml up -d --remove-orphans

            echo "Container status:"
            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml ps

            sudo docker logout

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment completed successfully."
          echo "Image tag: $IMAGE_TAG"
