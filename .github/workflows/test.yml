
name: Build and Deploy Maxx Toy Shop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config -q

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push database image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-database:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-database:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-frontend:latest

  deploy-ec2:
    name: Deploy to EC2
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Add the host key so SSH can run non-interactively.
          # For stronger security, verify the fingerprint independently.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy Compose file to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -eu

          test -f docker-compose.ec2.yml

          echo "Testing SSH connectivity..."

          ssh -v \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p ~/maxx-toystore' 2>&1

          echo "Copying Compose file..."

          scp \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            docker-compose.ec2.yml \
            "$EC2_USER@$EC2_HOST:~/maxx-toystore/docker-compose.ec2.yml"

          echo "Compose file copied successfully."

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD,IMAGE_TAG,MYSQL_ROOT_PASSWORD
          script: |
            set -eu

            cd "$HOME/maxx-toystore"

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io docker-compose-v2
              sudo systemctl enable --now docker
            fi

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin is missing."
              exit 1
            fi

            # Write environment variables without printing secrets.
            umask 077
            printf 'DOCKERHUB_USERNAME=%s\nIMAGE_TAG=%s\nMYSQL_ROOT_PASSWORD=%s\n' \
              "$DOCKERHUB_USERNAME" \
              "$IMAGE_TAG" \
              "$MYSQL_ROOT_PASSWORD" > .env

            # Authenticate using the same Docker account as the build job.
            printf '%s' "$DOCKERHUB_PASSWORD" |
              sudo docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            # Validate, pull the exact image versions, and deploy.
            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml config -q

            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml pull

            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml up -d --remove-orphans

            sudo docker compose \
              --env-file .env \
              -f docker-compose.ec2.yml ps

            sudo docker logout

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment completed successfully."
          echo "Image tag: $IMAGE_TAG"
