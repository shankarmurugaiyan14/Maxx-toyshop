
name: Maxx Toy Shop CI CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Database Image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          file: ./database/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-database:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-database:latest

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-backend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-frontend:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/maxx-toystore-frontend:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Containers through SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE_TAG,MYSQL_ROOT_PASSWORD
          script: |
            set -eu

            echo "=== Step 1: Check Docker ==="

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable --now docker
            fi

            echo "=== Step 2: Login to Docker Hub ==="

            printf '%s' "$DOCKER_PASSWORD" |
              sudo docker login \
                --username "$DOCKER_USERNAME" \
                --password-stdin

            echo "=== Step 3: Create Network and Persistent Volume ==="

            sudo docker network inspect maxx-toystore-network >/dev/null 2>&1 ||
              sudo docker network create maxx-toystore-network

            sudo docker volume create mysql_data >/dev/null

            echo "=== Step 4: Pull Images ==="

            sudo docker pull "$DOCKER_USERNAME/maxx-toystore-database:$IMAGE_TAG"
            sudo docker pull "$DOCKER_USERNAME/maxx-toystore-backend:$IMAGE_TAG"
            sudo docker pull "$DOCKER_USERNAME/maxx-toystore-frontend:$IMAGE_TAG"

            echo "=== Step 5: Start MySQL if Not Already Created ==="

            if ! sudo docker container inspect toystore-data >/dev/null 2>&1; then
              sudo docker run -d \
                --name toystore-data \
                --network maxx-toystore-network \
                --restart unless-stopped \
                --network-alias database \
                -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
                -e MYSQL_DATABASE=maxx_toy_shop \
                -v mysql_data:/var/lib/mysql \
                "$DOCKER_USERNAME/maxx-toystore-database:$IMAGE_TAG"
            else
              echo "Existing database container found; preserving it."
              sudo docker start toystore-data >/dev/null 2>&1 || true
              sudo docker network connect maxx-toystore-network toystore-data 2>/dev/null || true
            fi

            echo "=== Step 6: Wait for MySQL ==="

            DB_READY=0
            for i in $(seq 1 60); do
              if sudo docker exec toystore-data sh -c \
                'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' \
                >/dev/null 2>&1; then
                DB_READY=1
                break
              fi
              echo "Waiting for MySQL ($i/60)..."
              sleep 5
            done

            if [ "$DB_READY" -ne 1 ]; then
              echo "MySQL did not become ready. Check its logs."
              sudo docker logs --tail 100 toystore-data
              exit 1
            fi

            echo "=== Step 7: Recreate Backend ==="

            sudo docker rm -f toystore-back >/dev/null 2>&1 || true

            sudo docker run -d \
              --name toystore-back \
              --network maxx-toystore-network \
              --network-alias backend \
              --restart unless-stopped \
              -e SPRING_DATASOURCE_URL='jdbc:mysql://database:3306/maxx_toy_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata' \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD="$MYSQL_ROOT_PASSWORD" \
              "$DOCKER_USERNAME/maxx-toystore-backend:$IMAGE_TAG"

            echo "=== Step 8: Recreate Frontend ==="

            sudo docker rm -f toystore-front >/dev/null 2>&1 || true

            sudo docker run -d \
              --name toystore-front \
              --network maxx-toystore-network \
              --restart unless-stopped \
              -p 80:80 \
              "$DOCKER_USERNAME/maxx-toystore-frontend:$IMAGE_TAG"

            echo "=== Step 9: Show Deployment Status ==="

            sudo docker ps

            echo "Deployment commands completed."
