
name: Three Tier Application CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build all three Docker images
        run: docker compose Build

      - name: Push images to Docker Hub
        run: docker compose push

  EC2-deployment:
    needs: [build-test-push]  
    runs-on: ubuntu:latest

    steps:
       - name: SSH into Ec2 and deployment
         uses: appleboy/ssh-actions@v1.0.3
         with:
           host: ${{ secrets.EC2_HOST }}
           username: ${{ secrets.EC2_USER }}
           key: ${{ secrets.EC2_SSH_KEY }}
           script: |
             set -e

             sudo apt update -y
             sudo apt install docker -y
             echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin
             docker network create toy-Network
             docker pull maxx-toystore-frontend
             docker pull maxx-toystore-backend
             docekr pull maxx-toystore-database
             docker run -d --name Maxx-database --network toy-network -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=maxx-toy-shop -p 3306:3306 maxx-toystore-database
             docker run -d --name Maxx-backend --network toy-network -p 8080:8080  maxx-toystore-backend
             docker run -d --name Maxx-frontend --network toy-network -p 80:80 maxx-toystore-frontend 
             docker ps --filter "toy-network"
             

